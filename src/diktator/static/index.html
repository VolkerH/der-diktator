<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Der Diktator is a local dictation and transcription app: record your voice, edit the transcript, and copy your text."
    />
    <meta name="theme-color" content="#1c1240" />
    <title>Der Diktator · Dictation &amp; transcription</title>
    <link rel="icon" href="/assets/splash.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <img src="/assets/splash.svg" alt="" width="176" height="176" />
      <p class="splash-name">Der Diktator</p>
      <p class="splash-tagline">Dictation &amp; transcription</p>
    </div>
    <div class="shell">
      <aside id="sidebar" class="sidebar" aria-label="Chats">
        <span class="brand">
          <img class="brand-mark" src="/assets/splash.svg" alt="" />
          <span class="brand-text">
            Der Diktator
            <small>Dictation &amp; transcription</small>
          </span>
        </span>
        <button id="new-chat" class="new-chat" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          New chat
        </button>
        <ul id="chat-list" class="chat-list"></ul>
      </aside>
      <div id="scrim" class="scrim" hidden></div>

      <main>
        <header class="app-bar">
          <button
            id="menu"
            class="menu-button"
            type="button"
            aria-label="Show chats"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
          </button>
          <h1 id="chat-title" class="chat-title">New chat</h1>
          <span id="engine-status" class="engine-pill">Connecting…</span>
        </header>

        <section class="model-settings" aria-label="Speech model">
          <div class="model-controls">
            <label for="model-picker">Speech model</label>
            <select id="model-picker" aria-describedby="model-help" disabled>
              <option>Connecting…</option>
            </select>
            <button id="model-action" class="chip" type="button" disabled>Download model</button>
          </div>
          <p id="model-help" role="status" aria-live="polite">Loading model information…</p>
        </section>

        <section id="stage" class="stage" aria-label="Recorder">
          <canvas id="meter" class="meter" aria-hidden="true"></canvas>
          <div class="controls">
            <button id="record" class="orb-button record" type="button">
              <span class="orb" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="9" y="3" width="6" height="12" rx="3" />
                  <path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3" />
                </svg>
              </span>
              Record
            </button>
            <button id="stop" class="orb-button stop" type="button" disabled hidden>
              Stop &amp; transcribe
            </button>
          </div>
          <p class="clock">
            <span id="timer" aria-label="Recording duration">00:00</span>
            <span class="limit">/ 10:00</span>
          </p>
          <p id="status" class="status" role="status" aria-live="polite">Tap the mic to start.</p>
          <label class="switch" for="live-mode" title="Show text while you speak">
            <input id="live-mode" type="checkbox" checked />
            <span class="track" aria-hidden="true"></span>
            Live text
          </label>
        </section>

        <p id="error" class="error" role="alert" hidden></p>

        <section class="sheet" aria-label="Transcript">
          <label class="visually-hidden" for="transcript">Transcript</label>
          <textarea
            id="transcript"
            placeholder="Your words will appear here as you speak."
            spellcheck="true"
            aria-describedby="status"
          ></textarea>
          <ul id="clips" class="clips" aria-label="Recordings" hidden></ul>
          <div class="sheet-bar">
            <span class="sheet-info">
              <span id="word-count">0 words</span>
              <span id="save-state" class="save-state"></span>
            </span>
            <button id="copy" class="chip accent" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="11" height="12" rx="2" />
                <path d="M16 8V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h1" />
              </svg>
              <span class="copy-label">Copy</span>
            </button>
          </div>
        </section>
        <audio id="playback" hidden></audio>
        <noscript>Enable JavaScript to record and transcribe audio.</noscript>
      </main>
    </div>
  </body>
</html>
