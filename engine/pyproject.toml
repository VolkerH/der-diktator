[project]
name = "diktator-engine"
version = "0.1.0"
description = "CPU inference service for Phonon-2 and Parakeet v3"
requires-python = ">=3.12,<3.13"
# Native libraries are shipped separately; keep the matching core explicit.
dependencies = [
    "diktator",
    "fermion-research==0.2.10",
    "torch>=2.3",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "numpy>=2,<3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
diktator = { path = "..", editable = true }
torch = { index = "pytorch-cpu" }
