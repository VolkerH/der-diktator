[project]
name = "phonon-engine"
version = "0.1.0"
description = "Separate CPU inference environment for Fermion Phonon-2"
requires-python = ">=3.12,<3.13"
dependencies = ["fermion-research==0.2.10", "torch>=2.3"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
