name: diktator
services:
  diktator:
    image: ${DIKTATOR_IMAGE:-der-diktator:local}
    build:
      context: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:${DIKTATOR_PORT:-8080}:8080"
    environment:
      DIKTATOR_CPU_THREADS: ${DIKTATOR_CPU_THREADS:-4}
    volumes:
      - data:/data
      - models:/models
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  data:
  models:
